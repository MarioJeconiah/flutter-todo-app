name: pert6labpm
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"

flutter_native_splash:
 android: true
 ios: false
 web: false
 color: "#FFFFFF"
 image: assets/images/splashScreen.png
assets:
  - assets/images/icon.png
  - assets/images/splashScreen.png
android_12:
  color: "#FFFFFF"
  image: assets/images/splashScreen.png
